<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argon City — 3D Procedural City Simulation</title>
  <style>
    :root {
      --bg-panel: rgba(15, 19, 28, 0.82);
      --border-panel: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD Overlay */
    .hud-panel {
      position: absolute;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }

    #hud-top-left {
      top: 20px;
      left: 20px;
      width: 310px;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 16px;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.88rem;
    }

    .time-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      border-radius: 8px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .phase-label {
      color: var(--accent);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
    }

    .btn {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      hover: var(--accent-hover);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Info Panel (Right / Bottom-Right) */
    #info-panel {
      top: 20px;
      right: 20px;
      width: 280px;
      transform: translateX(320px);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      pointer-events: none;
    }

    #info-panel.visible {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .info-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    .type-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 8px;
    }

    .info-item-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .info-item-val {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Controls Hint */
    #controls-hint {
      bottom: 18px;
      left: 20px;
      padding: 8px 14px;
      font-size: 0.76rem;
      color: var(--text-muted);
      border-radius: 8px;
    }

    #controls-hint span {
      color: var(--text-main);
      font-weight: 500;
    }
  </style>

  <!-- ES Module Import Map for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top-Left Main HUD -->
  <div id="hud-top-left" class="hud-panel">
    <div class="brand-title">
      <span class="brand-dot"></span>
      Argon City
    </div>
    <div class="brand-subtitle">Procedural 3D Urban Micro-Simulation</div>

    <div class="hud-row">
      <div class="time-badge">
        <span id="clock-icon">☀️</span>
        <span id="clock-text">12:00</span>
      </div>
      <span id="phase-text" class="phase-label">Midday</span>
    </div>

    <div class="control-group">
      <div class="control-header">
        <span>Simulation Speed</span>
        <span id="speed-val">1.0x</span>
      </div>
      <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1.0" />
    </div>

    <button id="regen-btn" class="btn">
      <span>↻</span> Regenerate City
    </button>

    <div class="stats-bar">
      <span id="seed-display">Seed: #8492</span>
      <span id="entity-display">60 Cars · 80 Peds</span>
    </div>
  </div>

  <!-- Right Building Inspector Panel -->
  <div id="info-panel" class="hud-panel">
    <div class="info-header">
      <div id="b-name" class="info-title">Apex Tower</div>
      <button id="close-info" class="close-btn" title="Close">×</button>
    </div>
    <div id="b-type" class="type-pill">Tower</div>
    <div class="info-grid">
      <div>
        <div class="info-item-label">Floors</div>
        <div id="b-floors" class="info-item-val">42</div>
      </div>
      <div>
        <div class="info-item-label">Height</div>
        <div id="b-height" class="info-item-val">147 m</div>
      </div>
      <div>
        <div class="info-item-label">Footprint</div>
        <div id="b-footprint" class="info-item-val">24×24 m</div>
      </div>
      <div>
        <div class="info-item-label">Occupancy</div>
        <div id="b-occupancy" class="info-item-val">94%</div>
      </div>
    </div>
  </div>

  <!-- Bottom-Left Camera Controls Hint -->
  <div id="controls-hint" class="hud-panel">
    <span>Left Drag</span> Orbit &nbsp;·&nbsp; <span>Right Drag</span> Pan &nbsp;·&nbsp; <span>Scroll</span> Zoom &nbsp;·&nbsp; <span>Click Building</span> Inspect
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ==========================================
    // 1. SEEDED PRNG & CONFIGURATION
    // ==========================================
    class PRNG {
      constructor(seed = 12345) {
        this.seed = seed % 2147483647;
        if (this.seed <= 0) this.seed += 2147483646;
      }
      next() {
        this.seed = (this.seed * 16807) % 2147483647;
        return (this.seed - 1) / 2147483646;
      }
      range(min, max) {
        return min + this.next() * (max - min);
      }
      int(min, max) {
        return Math.floor(this.range(min, max + 1));
      }
      pick(arr) {
        return arr[Math.floor(this.next() * arr.length)];
      }
    }

    const CONFIG = {
      gridCount: 6,          // 6x6 city blocks (7x7 intersections)
      pitch: 24,             // Distance between road centers
      roadWidth: 6,          // Width of two-lane road
      blockSize: 18,         // 24 - 6 = 18 units per city block
      carCount: 56,
      pedCount: 85,
      dayDuration: 90        // Seconds for a full 24h cycle at 1.0x speed
    };

    const HALF_GRID = (CONFIG.gridCount * CONFIG.pitch) / 2; // 72
    const ROAD_COORDS = [];
    for (let i = 0; i <= CONFIG.gridCount; i++) {
      ROAD_COORDS.push(-HALF_GRID + i * CONFIG.pitch);
    }

    let rng = new PRNG(8492);
    let currentSeed = 8492;

    // ==========================================
    // 2. SCENE, CAMERA, RENDERER & CONTROLS
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0038);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 800);
    camera.position.set(115, 95, 135);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2 - 0.03; // Stay above ground
    controls.minDistance = 20;
    controls.maxDistance = 340;
    controls.target.set(0, 8, 0);

    // ==========================================
    // 3. LIGHTING & CELESTIAL BODIES
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 0.55);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.4);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 105;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 350;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Celestial visual spheres (Sun & Moon)
    const celestialGroup = new THREE.Group();
    scene.add(celestialGroup);

    const sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(7, 20, 20),
      new THREE.MeshBasicMaterial({ color: 0xfde047, fog: false })
    );
    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(5, 20, 20),
      new THREE.MeshBasicMaterial({ color: 0xe2e8f0, fog: false })
    );
    celestialGroup.add(sunMesh, moonMesh);

    // ==========================================
    // 4. SHARED MATERIALS
    // ==========================================
    const MATS = {
      asphalt: new THREE.MeshStandardMaterial({ color: 0x1e222a, roughness: 0.9, metalness: 0.05 }),
      roadLine: new THREE.MeshBasicMaterial({ color: 0xd97706 }),
      crosswalk: new THREE.MeshBasicMaterial({ color: 0xcbd5e1 }),
      sidewalk: new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.85 }),
      grass: new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.95 }),
      pole: new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5, metalness: 0.6 }),
      treeTrunk: new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 }),
      treeFoliage: new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.8 }),
      windowLit: new THREE.MeshStandardMaterial({
        color: 0xfef08a,
        emissive: 0xfde047,
        emissiveIntensity: 0.0,
        roughness: 0.2
      }),
      windowDark: new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        roughness: 0.15,
        metalness: 0.8
      }),
      streetLampBulb: new THREE.MeshStandardMaterial({
        color: 0xffedd5,
        emissive: 0xfb923c,
        emissiveIntensity: 0.0
      }),
      carHeadlight: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xfef08a,
        emissiveIntensity: 0.0
      }),
      carTaillight: new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xef4444,
        emissiveIntensity: 0.4
      }),
      carCabin: new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        roughness: 0.2,
        metalness: 0.7
      }),
      tlRed: new THREE.MeshStandardMaterial({ color: 0x450a0a, emissive: 0xff2222, emissiveIntensity: 0 }),
      tlYellow: new THREE.MeshStandardMaterial({ color: 0x422006, emissive: 0xfacc15, emissiveIntensity: 0 }),
      tlGreen: new THREE.MeshStandardMaterial({ color: 0x052e16, emissive: 0x22c55e, emissiveIntensity: 0 }),
      nsRed: null, nsYellow: null, nsGreen: null,
      ewRed: null, ewYellow: null, ewGreen: null,
      highlight: new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.65 })
    };

    // Clone traffic light materials for NS and EW directions so all intersections update in 0 draw call overhead
    MATS.nsRed = MATS.tlRed.clone();
    MATS.nsYellow = MATS.tlYellow.clone();
    MATS.nsGreen = MATS.tlGreen.clone();
    MATS.ewRed = MATS.tlRed.clone();
    MATS.ewYellow = MATS.tlYellow.clone();
    MATS.ewGreen = MATS.tlGreen.clone();

    // ==========================================
    // 5. CITY GENERATION CONTAINERS
    // ==========================================
    const cityGroup = new THREE.Group();
    scene.add(cityGroup);

    let buildingHitBoxes = [];
    let cars = [];
    let pedestrians = [];
    let selectionBoxMesh = null;

    // Name generation tables
    const PREFIXES = ['Argon', 'Nexus', 'Vanguard', 'Aether', 'Vertex', 'Solstice', 'Horizon', 'Obsidian', 'Kestrel', 'Meridian', 'Aurelia', 'Cobalt', 'Zenith', 'Orion', 'Helios', 'stratos'];
    const SUFFIXES = {
      Residential: ['Residences', 'Apartments', 'Lofts', 'Court', 'Gardens', 'Terrace', 'Commons'],
      Office: ['Center', 'Plaza', 'Hub', 'Corporate', 'Exchange', 'Square', ' Chambers'],
      Shop: ['Galleria', 'Market', 'Arcade', 'Bazaar', 'Pavilion', 'Corner', 'Emporium'],
      Tower: ['Tower', 'Spire', 'Pinnacle', 'Citadel', 'Monolith', 'Heights', ' Obelisk']
    };

    const PALETTES = {
      Residential: [0xd97757, 0xe29578, 0xcab89d, 0x8d99ae, 0xb5838d, 0x9a8c98],
      Office:      [0x64748b, 0x475569, 0x526d82, 0x778da9, 0x415a77, 0x6c757d],
      Shop:        [0xe07a5f, 0xf2cc8f, 0x81b29a, 0x5e60ce, 0x4ea8de, 0xf4a261],
      Tower:       [0x1e293b, 0x334155, 0x0f172a, 0x2b2d42, 0x1b263b, 0x22333b]
    };

    // ==========================================
    // 6. BUILD STATIC ENVIRONMENT & ROAD GRID
    // ==========================================
    function buildBaseGroundAndRoads() {
      // Surrounding dark earth plane
      const surroundGeo = new THREE.PlaneGeometry(900, 900);
      surroundGeo.rotateX(-Math.PI / 2);
      const surroundMat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 1.0 });
      const surroundMesh = new THREE.Mesh(surroundGeo, surroundMat);
      surroundMesh.position.y = -0.15;
      surroundMesh.receiveShadow = true;
      cityGroup.add(surroundMesh);

      // Asphalt base covering the entire grid
      const totalSpan = CONFIG.gridCount * CONFIG.pitch + CONFIG.roadWidth + 8;
      const roadBaseGeo = new THREE.BoxGeometry(totalSpan, 0.2, totalSpan);
      const roadBase = new THREE.Mesh(roadBaseGeo, MATS.asphalt);
      roadBase.position.y = -0.1;
      roadBase.receiveShadow = true;
      cityGroup.add(roadBase);

      // Dashed Road Center Lines (InstancedMesh)
      const dashGeo = new THREE.PlaneGeometry(0.22, 2.2);
      dashGeo.rotateX(-Math.PI / 2);
      const dashMatrices = [];
      const dummy = new THREE.Object3D();

      for (let r = 0; r <= CONFIG.gridCount; r++) {
        const roadCoord = ROAD_COORDS[r];
        for (let b = 0; b < CONFIG.gridCount; b++) {
          const segCenter = -HALF_GRID + (b + 0.5) * CONFIG.pitch;
          for (let d = -6; d <= 6; d += 4) {
            // North-South road segments
            dummy.position.set(roadCoord, 0.015, segCenter + d);
            dummy.rotation.set(0, 0, 0);
            dummy.updateMatrix();
            dashMatrices.push(dummy.matrix.clone());

            // East-West road segments
            dummy.position.set(segCenter + d, 0.015, roadCoord);
            dummy.rotation.set(0, Math.PI / 2, 0);
            dummy.updateMatrix();
            dashMatrices.push(dummy.matrix.clone());
          }
        }
      }

      const dashInst = new THREE.InstancedMesh(dashGeo, MATS.roadLine, dashMatrices.length);
      dashMatrices.forEach((m, i) => dashInst.setMatrixAt(i, m));
      cityGroup.add(dashInst);

      // Crosswalk stripes at intersections
      const cwGeo = new THREE.PlaneGeometry(0.4, 1.4);
      cwGeo.rotateX(-Math.PI / 2);
      const cwMatrices = [];

      for (let ix = 0; ix <= CONFIG.gridCount; ix++) {
        for (let iz = 0; iz <= CONFIG.gridCount; iz++) {
          const rx = ROAD_COORDS[ix];
          const rz = ROAD_COORDS[iz];
          for (let s = -2.0; s <= 2.0; s += 0.8) {
            // North & South crosswalks
            [-3.6, 3.6].forEach(offsetZ => {
              dummy.position.set(rx + s, 0.016, rz + offsetZ);
              dummy.rotation.set(0, 0, 0);
              dummy.updateMatrix();
              cwMatrices.push(dummy.matrix.clone());
            });
            // East & West crosswalks
            [-3.6, 3.6].forEach(offsetX => {
              dummy.position.set(rx + offsetX, 0.016, rz + s);
              dummy.rotation.set(0, Math.PI / 2, 0);
              dummy.updateMatrix();
              cwMatrices.push(dummy.matrix.clone());
            });
          }
        }
      }
      const cwInst = new THREE.InstancedMesh(cwGeo, MATS.crosswalk, cwMatrices.length);
      cwMatrices.forEach((m, i) => cwInst.setMatrixAt(i, m));
      cityGroup.add(cwInst);
    }

    // ==========================================
    // 7. BUILD CITY BLOCKS, BUILDINGS & WINDOWS
    // ==========================================
    function buildBlocksAndBuildings() {
      buildingHitBoxes = [];

      const sidewalkGeo = new THREE.BoxGeometry(CONFIG.blockSize, 0.22, CONFIG.blockSize);
      const grassGeo = new THREE.BoxGeometry(CONFIG.blockSize - 2.4, 0.26, CONFIG.blockSize - 2.4);

      const swMatrices = [];
      const grassMatrices = [];
      const treeTrunkMatrices = [];
      const treeFoliageMatrices = [];
      const litWindowMatrices = [];
      const darkWindowMatrices = [];

      const dummy = new THREE.Object3D();

      for (let gx = 0; gx < CONFIG.gridCount; gx++) {
        for (let gz = 0; gz < CONFIG.gridCount; gz++) {
          const cx = -HALF_GRID + (gx + 0.5) * CONFIG.pitch;
          const cz = -HALF_GRID + (gz + 0.5) * CONFIG.pitch;

          // Sidewalk slab
          dummy.position.set(cx, 0.11, cz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          swMatrices.push(dummy.matrix.clone());

          // Inner grass block
          dummy.position.set(cx, 0.13, cz);
          dummy.updateMatrix();
          grassMatrices.push(dummy.matrix.clone());

          // Distance from city center determines zoning probability
          const distFromCenter = Math.hypot(gx - (CONFIG.gridCount - 1) / 2, gz - (CONFIG.gridCount - 1) / 2);

          // Decide block layout: 1 large plot or 4 quadrant plots
          const isSinglePlot = (distFromCenter < 1.6 && rng.next() < 0.65) || rng.next() < 0.2;
          const plots = [];

          if (isSinglePlot) {
            plots.push({ x: cx, z: cz, maxW: 11.5, maxD: 11.5 });
          } else {
            const subOff = 3.7;
            plots.push(
              { x: cx - subOff, z: cz - subOff, maxW: 6.2, maxD: 6.2 },
              { x: cx + subOff, z: cz - subOff, maxW: 6.2, maxD: 6.2 },
              { x: cx - subOff, z: cz + subOff, maxW: 6.2, maxD: 6.2 },
              { x: cx + subOff, z: cz + subOff, maxW: 6.2, maxD: 6.2 }
            );
          }

          plots.forEach(plot => {
            // Small chance of a mini park / tree plaza on a sub-plot
            if (!isSinglePlot && rng.next() < 0.14) {
              for (let t = 0; t < 3; t++) {
                const tx = plot.x + rng.range(-1.8, 1.8);
                const tz = plot.z + rng.range(-1.8, 1.8);
                addTreeInstance(tx, tz, treeTrunkMatrices, treeFoliageMatrices, dummy);
              }
              return;
            }

            // Pick Building Type based on distance to downtown core
            let bType = 'Residential';
            const rVal = rng.next();
            if (distFromCenter < 1.5) {
              if (rVal < 0.50) bType = 'Tower';
              else if (rVal < 0.85) bType = 'Office';
              else bType = 'Shop';
            } else if (distFromCenter < 2.6) {
              if (rVal < 0.15) bType = 'Tower';
              else if (rVal < 0.55) bType = 'Office';
              else if (rVal < 0.80) bType = 'Shop';
              else bType = 'Residential';
            } else {
              if (rVal < 0.60) bType = 'Residential';
              else if (rVal < 0.85) bType = 'Shop';
              else bType = 'Office';
            }

            // Determine floors and dimensions
            let floors = 4;
            if (bType === 'Shop') floors = rng.int(1, 3);
            else if (bType === 'Residential') floors = rng.int(3, 8);
            else if (bType === 'Office') floors = rng.int(6, 15);
            else if (bType === 'Tower') floors = rng.int(16, 32);

            const floorHeight = 1.35;
            const h = floors * floorHeight;
            const w = rng.range(plot.maxW * 0.72, plot.maxW * 0.95);
            const d = rng.range(plot.maxD * 0.72, plot.maxD * 0.95);

            const colorHex = rng.pick(PALETTES[bType]);
            const bMat = new THREE.MeshStandardMaterial({
              color: colorHex,
              roughness: bType === 'Tower' ? 0.35 : 0.75,
              metalness: bType === 'Tower' ? 0.45 : 0.1
            });

            // Main building body
            const bGeo = new THREE.BoxGeometry(w, h, d);
            const bMesh = new THREE.Mesh(bGeo, bMat);
            const baseY = 0.26;
            bMesh.position.set(plot.x, baseY + h / 2, plot.z);
            bMesh.castShadow = true;
            bMesh.receiveShadow = true;
            cityGroup.add(bMesh);

            // Optional roof tier / crown detail
            if (bType === 'Tower' || (bType === 'Office' && rng.next() < 0.5)) {
              const roofH = rng.range(1.2, 2.8);
              const roofGeo = new THREE.BoxGeometry(w * 0.65, roofH, d * 0.65);
              const roofMesh = new THREE.Mesh(roofGeo, bMat);
              roofMesh.position.set(plot.x, baseY + h + roofH / 2, plot.z);
              roofMesh.castShadow = true;
              cityGroup.add(roofMesh);

              if (bType === 'Tower' && rng.next() < 0.6) {
                const spireH = rng.range(4, 8);
                const spireGeo = new THREE.CylinderGeometry(0.08, 0.25, spireH, 6);
                const spireMesh = new THREE.Mesh(spireGeo, MATS.pole);
                spireMesh.position.set(plot.x, baseY + h + roofH + spireH / 2, plot.z);
                cityGroup.add(spireMesh);
              }
            }

            // Store metadata for raycasting inspection
            const bName = `${rng.pick(PREFIXES)} ${rng.pick(SUFFIXES[bType])}`;
            bMesh.userData = {
              isBuilding: true,
              name: bName,
              type: bType,
              floors: floors,
              heightMeters: Math.round(floors * 3.5),
              footprintText: `${Math.round(w * 2.5)}×${Math.round(d * 2.5)} m`,
              occupancy: `${rng.int(72, 99)}%`,
              w, h, d,
              x: plot.x,
              y: baseY + h / 2,
              z: plot.z
            };
            buildingHitBoxes.push(bMesh);

            // Generate Window Panels around all 4 facades
            const winW = 0.68;
            const winH = 0.62;
            const colSpacing = 1.25;
            const colsX = Math.max(1, Math.floor((w - 0.8) / colSpacing));
            const colsZ = Math.max(1, Math.floor((d - 0.8) / colSpacing));

            for (let f = 0; f < floors; f++) {
              // Skip ground floor windows on residential sometimes
              if (f === 0 && bType === 'Residential' && rng.next() < 0.4) continue;
              const wy = baseY + (f + 0.55) * floorHeight;

              // Front (+Z) & Back (-Z) facades
              for (let c = 0; c < colsX; c++) {
                const wx = plot.x - ((colsX - 1) * colSpacing) / 2 + c * colSpacing;
                [1, -1].forEach(dir => {
                  const wz = plot.z + dir * (d / 2 + 0.02);
                  dummy.position.set(wx, wy, wz);
                  dummy.rotation.set(0, dir === 1 ? 0 : Math.PI, 0);
                  dummy.scale.set(winW, winH, 1);
                  dummy.updateMatrix();
                  if (rng.next() < 0.62) litWindowMatrices.push(dummy.matrix.clone());
                  else darkWindowMatrices.push(dummy.matrix.clone());
                });
              }

              // Right (+X) & Left (-X) facades
              for (let c = 0; c < colsZ; c++) {
                const wz = plot.z - ((colsZ - 1) * colSpacing) / 2 + c * colSpacing;
                [1, -1].forEach(dir => {
                  const wx = plot.x + dir * (w / 2 + 0.02);
                  dummy.position.set(wx, wy, wz);
                  dummy.rotation.set(0, dir === 1 ? Math.PI / 2 : -Math.PI / 2, 0);
                  dummy.scale.set(winW, winH, 1);
                  dummy.updateMatrix();
                  if (rng.next() < 0.62) litWindowMatrices.push(dummy.matrix.clone());
                  else darkWindowMatrices.push(dummy.matrix.clone());
                });
              }
            }
          });

          // Add corner sidewalk trees on each block
          const treeCornerOff = CONFIG.blockSize / 2 - 1.6;
          [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([dx, dz]) => {
            if (rng.next() < 0.65) {
              addTreeInstance(
                cx + dx * treeCornerOff,
                cz + dz * treeCornerOff,
                treeTrunkMatrices,
                treeFoliageMatrices,
                dummy
              );
            }
          });
        }
      }

      // Instantiate Sidewalks & Grass
      const swInst = new THREE.InstancedMesh(sidewalkGeo, MATS.sidewalk, swMatrices.length);
      swInst.receiveShadow = true;
      swMatrices.forEach((m, i) => swInst.setMatrixAt(i, m));
      cityGroup.add(swInst);

      const grassInst = new THREE.InstancedMesh(grassGeo, MATS.grass, grassMatrices.length);
      grassInst.receiveShadow = true;
      grassMatrices.forEach((m, i) => grassInst.setMatrixAt(i, m));
      cityGroup.add(grassInst);

      // Instantiate Windows (1 PlaneGeometry scaled via instance matrix)
      const unitWinGeo = new THREE.PlaneGeometry(1, 1);
      if (litWindowMatrices.length > 0) {
        const litWinInst = new THREE.InstancedMesh(unitWinGeo, MATS.windowLit, litWindowMatrices.length);
        litWindowMatrices.forEach((m, i) => litWinInst.setMatrixAt(i, m));
        cityGroup.add(litWinInst);
      }
      if (darkWindowMatrices.length > 0) {
        const darkWinInst = new THREE.InstancedMesh(unitWinGeo, MATS.windowDark, darkWindowMatrices.length);
        darkWindowMatrices.forEach((m, i) => darkWinInst.setMatrixAt(i, m));
        cityGroup.add(darkWinInst);
      }

      // Instantiate Trees
      if (treeTrunkMatrices.length > 0) {
        const trunkGeo = new THREE.CylinderGeometry(0.14, 0.2, 1.1, 6);
        const foliageGeo = new THREE.ConeGeometry(0.95, 2.2, 7);
        const trunkInst = new THREE.InstancedMesh(trunkGeo, MATS.treeTrunk, treeTrunkMatrices.length);
        const foliageInst = new THREE.InstancedMesh(foliageGeo, MATS.treeFoliage, treeFoliageMatrices.length);
        foliageInst.castShadow = true;
        treeTrunkMatrices.forEach((m, i) => trunkInst.setMatrixAt(i, m));
        treeFoliageMatrices.forEach((m, i) => foliageInst.setMatrixAt(i, m));
        cityGroup.add(trunkInst, foliageInst);
      }
    }

    function addTreeInstance(x, z, trunkMats, foliageMats, dummy) {
      const scale = rng.range(0.85, 1.25);
      dummy.position.set(x, 0.26 + 0.55 * scale, z);
      dummy.rotation.set(0, rng.range(0, Math.PI), 0);
      dummy.scale.set(scale, scale, scale);
      dummy.updateMatrix();
      trunkMats.push(dummy.matrix.clone());

      dummy.position.set(x, 0.26 + 1.75 * scale, z);
      dummy.updateMatrix();
      foliageMats.push(dummy.matrix.clone());
    }

    // ==========================================
    // 8. TRAFFIC LIGHT POLES & STREETLIGHTS
    // ==========================================
    function buildTrafficLightsAndStreetlamps() {
      const poleMatrices = [];
      const bulbMatrices = [];
      const dummy = new THREE.Object3D();

      // Place traffic light poles at every intersection (2 diagonal corners per intersection)
      const poleGeo = new THREE.CylinderGeometry(0.1, 0.12, 3.6, 8);
      const boxGeo = new THREE.BoxGeometry(0.38, 1.05, 0.38);
      const lightDotGeo = new THREE.SphereGeometry(0.12, 8, 8);

      for (let ix = 0; ix <= CONFIG.gridCount; ix++) {
        for (let iz = 0; iz <= CONFIG.gridCount; iz++) {
          const rx = ROAD_COORDS[ix];
          const rz = ROAD_COORDS[iz];

          // SE corner (+3.4, +3.4) and NW corner (-3.4, -3.4)
          [[3.4, 3.4], [-3.4, -3.4]].forEach(([ox, oz]) => {
            const px = rx + ox;
            const pz = rz + oz;

            const tlGroup = new THREE.Group();
            tlGroup.position.set(px, 0.22, pz);

            const pole = new THREE.Mesh(poleGeo, MATS.pole);
            pole.position.y = 1.8;
            tlGroup.add(pole);

            const housing = new THREE.Mesh(boxGeo, MATS.pole);
            housing.position.y = 3.3;
            tlGroup.add(housing);

            // Bulbs on North/South faces (controlled by NS materials)
            const nsR = new THREE.Mesh(lightDotGeo, MATS.nsRed);
            const nsY = new THREE.Mesh(lightDotGeo, MATS.nsYellow);
            const nsG = new THREE.Mesh(lightDotGeo, MATS.nsGreen);
            nsR.position.set(0, 3.62, 0.18);
            nsY.position.set(0, 3.30, 0.18);
            nsG.position.set(0, 2.98, 0.18);

            const nsR2 = nsR.clone(); nsR2.position.z = -0.18;
            const nsY2 = nsY.clone(); nsY2.position.z = -0.18;
            const nsG2 = nsG.clone(); nsG2.position.z = -0.18;

            // Bulbs on East/West faces (controlled by EW materials)
            const ewR = new THREE.Mesh(lightDotGeo, MATS.ewRed);
            const ewY = new THREE.Mesh(lightDotGeo, MATS.ewYellow);
            const ewG = new THREE.Mesh(lightDotGeo, MATS.ewGreen);
            ewR.position.set(0.18, 3.62, 0);
            ewY.position.set(0.18, 3.30, 0);
            ewG.position.set(0.18, 2.98, 0);

            const ewR2 = ewR.clone(); ewR2.position.x = -0.18;
            const ewY2 = ewY.clone(); ewY2.position.x = -0.18;
            const ewG2 = ewG.clone(); ewG2.position.x = -0.18;

            tlGroup.add(nsR, nsY, nsG, nsR2, nsY2, nsG2, ewR, ewY, ewG, ewR2, ewY2, ewG2);
            cityGroup.add(tlGroup);
          });
        }
      }

      // Streetlights along blocks
      for (let gx = 0; gx < CONFIG.gridCount; gx++) {
        for (let gz = 0; gz < CONFIG.gridCount; gz++) {
          const cx = -HALF_GRID + (gx + 0.5) * CONFIG.pitch;
          const cz = -HALF_GRID + (gz + 0.5) * CONFIG.pitch;
          const edge = CONFIG.blockSize / 2 - 0.55;

          [
            [cx, cz - edge],
            [cx, cz + edge],
            [cx - edge, cz],
            [cx + edge, cz]
          ].forEach(([lx, lz]) => {
            dummy.position.set(lx, 0.22 + 2.1, lz);
            dummy.rotation.set(0, 0, 0);
            dummy.scale.set(1, 1, 1);
            dummy.updateMatrix();
            poleMatrices.push(dummy.matrix.clone());

            dummy.position.set(lx, 0.22 + 4.25, lz);
            dummy.updateMatrix();
            bulbMatrices.push(dummy.matrix.clone());
          });
        }
      }

      const lampPoleGeo = new THREE.CylinderGeometry(0.07, 0.1, 4.2, 6);
      const lampBulbGeo = new THREE.SphereGeometry(0.24, 8, 8);

      const lampPoleInst = new THREE.InstancedMesh(lampPoleGeo, MATS.pole, poleMatrices.length);
      const lampBulbInst = new THREE.InstancedMesh(lampBulbGeo, MATS.streetLampBulb, bulbMatrices.length);
      poleMatrices.forEach((m, i) => lampPoleInst.setMatrixAt(i, m));
      bulbMatrices.forEach((m, i) => lampBulbInst.setMatrixAt(i, m));
      cityGroup.add(lampPoleInst, lampBulbInst);
    }

    // ==========================================
    // 9. CARS & TRAFFIC SYSTEM
    // ==========================================
    const CAR_COLORS = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0xe2e8f0, 0x14b8a6];

    function createCarMesh(colorHex) {
      const carGroup = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.4 });
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.48, 2.5), bodyMat);
      chassis.position.y = 0.36;
      chassis.castShadow = true;
      carGroup.add(chassis);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.42, 1.35), MATS.carCabin);
      cabin.position.set(0, 0.78, -0.1);
      carGroup.add(cabin);

      // Headlights (+Z front)
      const hlGeo = new THREE.BoxGeometry(0.26, 0.16, 0.08);
      const hlLeft = new THREE.Mesh(hlGeo, MATS.carHeadlight);
      hlLeft.position.set(0.42, 0.38, 1.26);
      const hlRight = hlLeft.clone();
      hlRight.position.x = -0.42;
      carGroup.add(hlLeft, hlRight);

      // Taillights (-Z back)
      const tlLeft = new THREE.Mesh(hlGeo, MATS.carTaillight);
      tlLeft.position.set(0.42, 0.38, -1.26);
      const tlRight = tlLeft.clone();
      tlRight.position.x = -0.42;
      carGroup.add(tlLeft, tlRight);

      return carGroup;
    }

    function spawnCars() {
      cars = [];
      const laneOffset = 1.45; // Right-hand traffic lane offset from road center

      for (let i = 0; i < CONFIG.carCount; i++) {
        const color = rng.pick(CAR_COLORS);
        const mesh = createCarMesh(color);

        const axis = rng.next() < 0.5 ? 'z' : 'x'; // 'z' = North-South road, 'x' = East-West road
        const dir = rng.next() < 0.5 ? 1 : -1;
        const roadIdx = rng.int(0, CONFIG.gridCount);
        const roadCoord = ROAD_COORDS[roadIdx];
        const posAlong = rng.range(-HALF_GRID + 4, HALF_GRID - 4);

        const car = {
          mesh,
          axis,
          dir,
          roadCoord,
          posAlong,
          speed: 0,
          maxSpeed: rng.range(11, 15.5),
          laneOffset,
          lastTurnIntersection: -999
        };

        syncCarTransform(car);
        cityGroup.add(mesh);
        cars.push(car);
      }
    }

    function syncCarTransform(car) {
      if (car.axis === 'z') {
        // Travelling along Z: right-hand side is +X when dir=+1, -X when dir=-1 -> wait:
        // Facing +Z: right hand is -X. Facing -Z: right hand is +X.
        const lx = car.roadCoord - car.dir * car.laneOffset;
        car.mesh.position.set(lx, 0, car.posAlong);
        car.mesh.rotation.y = car.dir === 1 ? 0 : Math.PI;
      } else {
        // Facing +X: right hand is +Z. Facing -X: right hand is -Z.
        const lz = car.roadCoord + car.dir * car.laneOffset;
        car.mesh.position.set(car.posAlong, 0, lz);
        car.mesh.rotation.y = car.dir === 1 ? Math.PI / 2 : -Math.PI / 2;
      }
    }

    // Traffic light state helper
    let trafficClock = 0;
    function getTrafficStates(t) {
      // 16s full cycle:
      // 0..6.5: NS Green, EW Red
      // 6.5..8.0: NS Yellow, EW Red
      // 8.0..14.5: NS Red, EW Green
      // 14.5..16.0: NS Red, EW Yellow
      const c = t % 16;
      let ns = 'red', ew = 'red';
      if (c < 6.5) { ns = 'green'; ew = 'red'; }
      else if (c < 8.0) { ns = 'yellow'; ew = 'red'; }
      else if (c < 14.5) { ns = 'red'; ew = 'green'; }
      else { ns = 'red'; ew = 'yellow'; }
      return { ns, ew };
    }

    function updateTrafficLightsVisuals(states) {
      MATS.nsRed.emissiveIntensity    = states.ns === 'red' ? 2.2 : 0.05;
      MATS.nsYellow.emissiveIntensity = states.ns === 'yellow' ? 2.2 : 0.05;
      MATS.nsGreen.emissiveIntensity  = states.ns === 'green' ? 2.2 : 0.05;

      MATS.ewRed.emissiveIntensity    = states.ew === 'red' ? 2.2 : 0.05;
      MATS.ewYellow.emissiveIntensity = states.ew === 'yellow' ? 2.2 : 0.05;
      MATS.ewGreen.emissiveIntensity  = states.ew === 'green' ? 2.2 : 0.05;
    }

    function updateCars(dt, states) {
      for (let i = 0; i < cars.length; i++) {
        const car = cars[i];
        const lightState = car.axis === 'z' ? states.ns : states.ew;

        let shouldStop = false;

        // 1. Check upcoming intersection stop line
        for (let r = 0; r <= CONFIG.gridCount; r++) {
          const interCoord = ROAD_COORDS[r];
          const stopLine = interCoord - car.dir * 4.2;
          const distToStop = (stopLine - car.posAlong) * car.dir;

          if (distToStop > 0 && distToStop < 6.5) {
            if (lightState === 'red' || (lightState === 'yellow' && distToStop > 2.2)) {
              shouldStop = true;
              break;
            }
          }

          // 2. Random turn at intersection center when light is green
          const distToCenter = Math.abs(car.posAlong - interCoord);
          if (distToCenter < 0.45 && car.lastTurnIntersection !== r && lightState === 'green') {
            car.lastTurnIntersection = r;
            if (rng.next() < 0.28) {
              car.axis = car.axis === 'z' ? 'x' : 'z';
              car.dir = rng.next() < 0.5 ? 1 : -1;
              const oldRoad = car.roadCoord;
              car.roadCoord = interCoord;
              car.posAlong = oldRoad;
              break;
            }
          }
        }

        // 3. Check car ahead in the same lane to prevent collisions
        for (let j = 0; j < cars.length; j++) {
          if (i === j) continue;
          const other = cars[j];
          if (other.axis === car.axis && other.dir === car.dir && Math.abs(other.roadCoord - car.roadCoord) < 0.1) {
            const gap = (other.posAlong - car.posAlong) * car.dir;
            if (gap > 0 && gap < 5.2) {
              shouldStop = true;
              break;
            }
          }
        }

        // Smooth acceleration / braking
        if (shouldStop) {
          car.speed = Math.max(0, car.speed - 28 * dt);
        } else {
          car.speed = Math.min(car.maxSpeed, car.speed + 14 * dt);
        }

        car.posAlong += car.dir * car.speed * dt;

        // Wrap around at city edges or U-turn
        const bound = HALF_GRID + 2.5;
        if (car.posAlong > bound) {
          car.posAlong = -bound;
          car.lastTurnIntersection = -999;
        } else if (car.posAlong < -bound) {
          car.posAlong = bound;
          car.lastTurnIntersection = -999;
        }

        syncCarTransform(car);
      }
    }

    // ==========================================
    // 10. PEDESTRIANS ON SIDEWALKS
    // ==========================================
    function spawnPedestrians() {
      pedestrians = [];
      const pedGeo = new THREE.CapsuleGeometry(0.16, 0.42, 4, 8);
      const pedColors = [0x38bdf8, 0xf43f5e, 0xa855f7, 0x10b981, 0xfacc15, 0xf97316, 0xe2e8f0];

      for (let i = 0; i < CONFIG.pedCount; i++) {
        const gx = rng.int(0, CONFIG.gridCount - 1);
        const gz = rng.int(0, CONFIG.gridCount - 1);
        const cx = -HALF_GRID + (gx + 0.5) * CONFIG.pitch;
        const cz = -HALF_GRID + (gz + 0.5) * CONFIG.pitch;

        const mat = new THREE.MeshStandardMaterial({ color: rng.pick(pedColors), roughness: 0.7 });
        const mesh = new THREE.Mesh(pedGeo, mat);
        mesh.castShadow = true;

        const pathHalf = CONFIG.blockSize / 2 - 0.85; // 8.15m square loop on sidewalk
        const ped = {
          mesh,
          cx,
          cz,
          pathHalf,
          side: rng.int(0, 3),
          progress: rng.range(0, 1),
          speed: rng.range(0.08, 0.16),
          dir: rng.next() < 0.5 ? 1 : -1,
          bobPhase: rng.range(0, Math.PI * 2)
        };

        cityGroup.add(mesh);
        pedestrians.push(ped);
      }
    }

    function updatePedestrians(dt, elapsed) {
      for (let i = 0; i < pedestrians.length; i++) {
        const p = pedestrians[i];
        p.progress += p.speed * dt * p.dir;

        if (p.progress > 1) {
          p.progress -= 1;
          p.side = (p.side + 1) % 4;
        } else if (p.progress < 0) {
          p.progress += 1;
          p.side = (p.side + 3) % 4;
        }

        const t = (p.progress - 0.5) * 2 * p.pathHalf;
        const r = p.pathHalf;
        let px = p.cx, pz = p.cz;

        if (p.side === 0) { px = p.cx + t; pz = p.cz - r; }
        else if (p.side === 1) { px = p.cx + r; pz = p.cz + t; }
        else if (p.side === 2) { px = p.cx - t; pz = p.cz + r; }
        else { px = p.cx - r; pz = p.cz - t; }

        const bob = Math.abs(Math.sin(elapsed * 8 + p.bobPhase)) * 0.08;
        p.mesh.position.set(px, 0.58 + bob, pz);
      }
    }

    // ==========================================
    // 11. DAY–NIGHT CYCLE & ATMOSPHERE
    // ==========================================
    let timeOfDay = 10.5; // Starts at 10:30 AM (0..24)
    let simSpeed = 1.0;

    const SKY_KEYFRAMES = [
      { hour: 0,  sky: new THREE.Color(0x070b19), amb: 0.16, sun: 0.0,  phase: 'Midnight', icon: '🌙' },
      { hour: 5,  sky: new THREE.Color(0x0f172a), amb: 0.20, sun: 0.0,  phase: 'Dawn',     icon: '🌅' },
      { hour: 6.5,sky: new THREE.Color(0xfd8b5b), amb: 0.45, sun: 0.75, phase: 'Sunrise',  icon: '🌅' },
      { hour: 9,  sky: new THREE.Color(0x60a5fa), amb: 0.60, sun: 1.25, phase: 'Morning',  icon: '☀️' },
      { hour: 12, sky: new THREE.Color(0x87ceeb), amb: 0.70, sun: 1.45, phase: 'Midday',   icon: '☀️' },
      { hour: 16, sky: new THREE.Color(0x60a5fa), amb: 0.60, sun: 1.20, phase: 'Afternoon',icon: '☀️' },
      { hour: 18, sky: new THREE.Color(0xf97316), amb: 0.45, sun: 0.70, phase: 'Sunset',   icon: '🌇' },
      { hour: 19.5,sky:new THREE.Color(0x1e1b4b), amb: 0.22, sun: 0.05, phase: 'Dusk',     icon: '🌆' },
      { hour: 24, sky: new THREE.Color(0x070b19), amb: 0.16, sun: 0.0,  phase: 'Midnight', icon: '🌙' }
    ];

    const clockTextEl = document.getElementById('clock-text');
    const clockIconEl = document.getElementById('clock-icon');
    const phaseTextEl = document.getElementById('phase-text');

    function updateDayNightCycle(dt) {
      // Advance clock
      timeOfDay = (timeOfDay + (dt * 24 / CONFIG.dayDuration) * simSpeed) % 24;

      // Find surrounding keyframes
      let k0 = SKY_KEYFRAMES[0], k1 = SKY_KEYFRAMES[1];
      for (let i = 0; i < SKY_KEYFRAMES.length - 1; i++) {
        if (timeOfDay >= SKY_KEYFRAMES[i].hour && timeOfDay <= SKY_KEYFRAMES[i + 1].hour) {
          k0 = SKY_KEYFRAMES[i];
          k1 = SKY_KEYFRAMES[i + 1];
          break;
        }
      }

      const span = k1.hour - k0.hour || 1;
      const alpha = (timeOfDay - k0.hour) / span;

      // Interpolate sky and fog color
      scene.background.lerpColors(k0.sky, k1.sky, alpha);
      scene.fog.color.copy(scene.background);

      // Sun & Moon orbital angle (6:00 = sunrise at 0 rad, 12:00 = zenith at PI/2, 18:00 = sunset at PI)
      const sunAngle = ((timeOfDay - 6) / 24) * Math.PI * 2;
      const orbitRadius = 190;
      const sx = Math.cos(sunAngle) * orbitRadius;
      const sy = Math.sin(sunAngle) * orbitRadius;
      const sz = 45;

      sunMesh.position.set(sx, sy, sz);
      moonMesh.position.set(-sx, -sy, -sz);

      // Position directional light from either sun (day) or moon (night)
      if (sy > 0) {
        sunLight.position.set(sx, Math.max(sy, 18), sz);
        sunLight.color.setHex(sy < 65 ? 0xfdba74 : 0xfffbeb);
      } else {
        sunLight.position.set(-sx, Math.max(-sy, 25), -sz);
        sunLight.color.setHex(0x93c5fd);
      }

      const sunInt = THREE.MathUtils.lerp(k0.sun, k1.sun, alpha);
      const ambInt = THREE.MathUtils.lerp(k0.amb, k1.amb, alpha);
      sunLight.intensity = sy > 0 ? sunInt : 0.22; // Soft moonlight at night
      ambientLight.intensity = ambInt;
      hemiLight.intensity = ambInt * 0.85;

      // Nighttime emissive intensity for windows, streetlights, and headlights
      const isNightFactor = THREE.MathUtils.clamp(1 - (sy + 20) / 55, 0, 1);
      MATS.windowLit.emissiveIntensity = isNightFactor * 1.45;
      MATS.streetLampBulb.emissiveIntensity = isNightFactor * 2.5;
      MATS.carHeadlight.emissiveIntensity = isNightFactor * 3.0;

      // Update HUD Clock
      const hours = Math.floor(timeOfDay);
      const mins = Math.floor((timeOfDay - hours) * 60);
      clockTextEl.textContent = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
      clockIconEl.textContent = k0.icon;
      phaseTextEl.textContent = k0.phase;
    }

    // ==========================================
    // 12. CITY GENERATION ORCHESTRATOR
    // ==========================================
    function generateCity(seed) {
      currentSeed = seed;
      rng = new PRNG(seed);
      document.getElementById('seed-display').textContent = `Seed: #${seed}`;
      hideBuildingInfo();

      // Dispose previous geometries/materials inside cityGroup
      while (cityGroup.children.length > 0) {
        const child = cityGroup.children[0];
        cityGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
      }

      buildBaseGroundAndRoads();
      buildBlocksAndBuildings();
      buildTrafficLightsAndStreetlamps();
      spawnCars();
      spawnPedestrians();

      // Re-create selection wireframe mesh
      const selGeo = new THREE.BoxGeometry(1, 1, 1);
      selectionBoxMesh = new THREE.Mesh(selGeo, MATS.highlight);
      selectionBoxMesh.visible = false;
      cityGroup.add(selectionBoxMesh);
    }

    // ==========================================
    // 13. INTERACTION & RAYCASTING
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    const infoPanel = document.getElementById('info-panel');
    const bNameEl = document.getElementById('b-name');
    const bTypeEl = document.getElementById('b-type');
    const bFloorsEl = document.getElementById('b-floors');
    const bHeightEl = document.getElementById('b-height');
    const bFootprintEl = document.getElementById('b-footprint');
    const bOccupancyEl = document.getElementById('b-occupancy');

    function showBuildingInfo(data) {
      bNameEl.textContent = data.name;
      bTypeEl.textContent = data.type;
      bFloorsEl.textContent = data.floors;
      bHeightEl.textContent = `${data.heightMeters} m`;
      bFootprintEl.textContent = data.footprintText;
      bOccupancyEl.textContent = data.occupancy;
      infoPanel.classList.add('visible');

      if (selectionBoxMesh) {
        selectionBoxMesh.visible = true;
        selectionBoxMesh.scale.set(data.w + 0.35, data.h + 0.35, data.d + 0.35);
        selectionBoxMesh.position.set(data.x, data.y, data.z);
      }
    }

    function hideBuildingInfo() {
      infoPanel.classList.remove('visible');
      if (selectionBoxMesh) selectionBoxMesh.visible = false;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (moveDist > 6) return; // Ignore camera drags

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(buildingHitBoxes, false);

      if (hits.length > 0 && hits[0].object.userData.isBuilding) {
        showBuildingInfo(hits[0].object.userData);
      } else {
        hideBuildingInfo();
      }
    });

    document.getElementById('close-info').addEventListener('click', hideBuildingInfo);

    // ==========================================
    // 14. UI CONTROLS & RESIZE HANDLER
    // ==========================================
    const speedSlider = document.getElementById('speed-slider');
    const speedValEl = document.getElementById('speed-val');

    speedSlider.addEventListener('input', (e) => {
      simSpeed = parseFloat(e.target.value);
      speedValEl.textContent = `${simSpeed.toFixed(1)}x`;
    });

    document.getElementById('regen-btn').addEventListener('click', () => {
      const newSeed = Math.floor(1000 + Math.random() * 9000);
      generateCity(newSeed);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 15. INITIALIZE & ANIMATION LOOP
    // ==========================================
    generateCity(currentSeed);

    const clock = new THREE.Clock();
    let elapsedTotal = 0;

    function animate() {
      requestAnimationFrame(animate);

      const rawDt = Math.min(clock.getDelta(), 0.1);
      const simDt = rawDt * simSpeed;
      elapsedTotal += simDt;
      trafficClock += simDt;

      const trafficStates = getTrafficStates(trafficClock);
      updateTrafficLightsVisuals(trafficStates);
      updateCars(simDt, trafficStates);
      updatePedestrians(simDt, elapsedTotal);
      updateDayNightCycle(rawDt);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
